name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APK_NAME: mockloc-debug.apk

# One rolling release, updated on every green build of main. Actions artifacts need a login to
# download; release assets do not, which is what makes "push → CI → 直接下载安装" a no-auth loop.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  logic:
    # The coordinate layer is the one thing testable without an Android SDK, so it gates the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Coordinate acceptance tests
        run: python tools/tests/test_coords.py

      # The local Kotlin type-check never opens the manifest, so XML mistakes used to surface only
      # here - after the apk job had already spent minutes on Gradle.
      - name: Manifest and resource XML checks
        run: python tools/tests/test_manifest.py

  apk:
    needs: logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # No gradle wrapper jar is committed (this repo is never built on a dev machine), so the
      # action installs the pinned distribution instead of ./gradlew.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      # Without this AGP mints a fresh debug keystore on every runner, so each build has a
      # different signature and reinstalling means uninstall + re-granting the mock app-op.
      - name: Restore stable debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 not set - this build's signature will differ from the previous one, so install needs an uninstall first."
          else
            mkdir -p "$HOME/.android"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "debug keystore restored"
          fi

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug -PgitSha="${GITHUB_SHA:0:7}"

      - name: Report APK identity
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          "$aapt2" dump badging "$APK_NAME" | head -3
          "$aapt2" dump badging "$APK_NAME" | grep -E "package:|sdkVersion|targetSdkVersion" || true
          unzip -l "$APK_NAME" | grep -E "xposed" || { echo "xposed entry files missing from APK"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: mockloc-apk
          path: ${{ env.APK_NAME }}

  root-module:
    needs: logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax check every script
        run: |
          for f in rootmodule/*.sh; do sh -n "$f" || { echo "syntax error in $f"; exit 1; }; done

      - name: Package module zip
        run: |
          set -euo pipefail
          STAGE=$(mktemp -d)
          cp -r rootmodule/. "$STAGE/"
          mkdir -p "$STAGE/META-INF/com/google/android"
          # The installer glue is owned by Magisk; KernelSU/APatch read the same module format.
          curl -fsSL -o "$STAGE/META-INF/com/google/android/update-binary" \
            https://raw.githubusercontent.com/topjohnwu/Magisk/master/scripts/module_installer.sh
          chmod 755 "$STAGE/META-INF/com/google/android/update-binary"
          printf '#MAGISK\n' > "$STAGE/META-INF/com/google/android/updater-script"
          for f in "$STAGE"/*.sh; do chmod 755 "$f"; done
          grep -q '^id=mockloc$' "$STAGE/module.prop"
          (cd "$STAGE" && zip -r9 "$GITHUB_WORKSPACE/mockloc-root.zip" .)
          unzip -l mockloc-root.zip

      - uses: actions/upload-artifact@v7
        with:
          name: mockloc-root-module
          path: mockloc-root.zip

  release:
    # Publish both artifacts to the rolling "latest" release so the install URLs are stable and
    # reachable without any GitHub login:
    #   https://github.com/JJKLab/android-mockloc/releases/download/latest/mockloc-debug.apk
    #   https://github.com/JJKLab/android-mockloc/releases/download/latest/mockloc-root.zip
    needs: [apk, root-module]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-latest
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mockloc-apk
      - uses: actions/download-artifact@v7
        with:
          name: mockloc-root-module
      - name: Publish to the rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create latest --repo "$GITHUB_REPOSITORY" \
                 --title "最新构建（main 分支自动更新）" \
                 --notes "main 每次构建成功后自动覆盖此 Release 的两个产物。"
          gh release upload latest mockloc-debug.apk mockloc-root.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
          # Point the notes at the exact commit these assets came from. Single line on purpose:
          # a multi-line shell string wraps at column 0 and truncates the run block's YAML.
          gh release edit latest --repo "$GITHUB_REPOSITORY" \
            --title "最新构建（main 分支自动更新）" \
            --notes "构建自 commit ${GITHUB_SHA:0:7}（branch: $GITHUB_REF_NAME）。mockloc-debug.apk = App + libxposed 模块（versionName 带 commit 短 SHA）；mockloc-root.zip = KernelSU/APatch/Magisk 模块。装机验收判据见 README 附录 C31/C32。"
